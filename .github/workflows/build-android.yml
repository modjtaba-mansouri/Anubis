name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'firebase-config.js'
      - 'icons/**'
      - 'capacitor/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Android dependencies
        working-directory: capacitor
        run: npm ci

      - name: Sync web assets into the Android project
        run: |
          mkdir -p capacitor/android/app/src/main/assets/public/icons
          cp index.html sw.js manifest.webmanifest firebase-config.js capacitor/android/app/src/main/assets/public/
          cp icons/*.png capacitor/android/app/src/main/assets/public/icons/

      - name: Generate Android app icon from source icon
        working-directory: capacitor
        run: |
          pip install --quiet --break-system-packages pillow
          mkdir -p resources
          python3 - <<'PY'
          from PIL import Image
          Image.open('../icons/icon-512.png').convert('RGBA').save('resources/icon.png')
          Image.open('../icons/icon-maskable-512.png').convert('RGBA').save('resources/icon-foreground.png')
          Image.new('RGBA', (512, 512), (5, 6, 7, 255)).save('resources/icon-background.png')
          PY
          npx @capacitor/assets generate --android
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          sizes = {'mipmap-ldpi':36,'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          src = Image.open('resources/icon.png').convert('RGBA')
          for folder, px in sizes.items():
              resized = src.resize((px, px), Image.LANCZOS)
              resized.save(f'android/app/src/main/res/{folder}/ic_launcher.png')
              mask = Image.new('L', (px, px), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, px, px), fill=255)
              round_icon = Image.new('RGBA', (px, px), (0,0,0,0))
              round_icon.paste(resized, (0,0), mask)
              round_icon.save(f'android/app/src/main/res/{folder}/ic_launcher_round.png')
          print('legacy launcher icons regenerated')
          PY

      - name: Compute version
        id: ver
        run: |
          NAME=$(grep -oP "(?<=const APP_VERSION=')[^']+" index.html)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APKs (split per ABI)
        working-directory: capacitor/android
        env:
          ANUBIS_KEYSTORE_PATH: ../../keystore/anubis-release.keystore
          ANUBIS_KEYSTORE_PASSWORD: ${{ secrets.ANUBIS_KEYSTORE_PASSWORD }}
          ANUBIS_KEY_ALIAS: ${{ secrets.ANUBIS_KEY_ALIAS }}
          ANUBIS_KEY_PASSWORD: ${{ secrets.ANUBIS_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Locate built APK (arm64)
        id: apks
        run: |
          find capacitor/android/app/build/outputs/apk/release -name "*.apk"
          ARM64=$(find capacitor/android/app/build/outputs/apk/release -iname "*arm64-v8a*release*.apk" | head -1)
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release
        run: cp "${{ steps.apks.outputs.arm64 }}" "Anubis-${{ steps.ver.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Anubis v${{ steps.ver.outputs.name }}
          files: Anubis-${{ steps.ver.outputs.name }}.apk
          make_latest: true
